<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Lost in the Matrix | VEYRONIS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%238b5cf6'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-weight='bold'%3EV%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0a0a0c;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Glow */
        body::before {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .error-container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
            background: rgba(30, 30, 34, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .error-code {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -4px;
            background: linear-gradient(135deg, #a78bfa, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 30px rgba(167, 139, 250, 0.3));
        }

        .error-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .error-desc {
            font-size: 15px;
            color: #a3a3a3;
            line-height: 1.6;
            margin-bottom: 32px;
            padding: 0 20px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 999px;
            background: linear-gradient(135deg, #a78bfa, #818cf8);
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 32px rgba(167, 139, 250, 0.3);
            border: none;
            cursor: pointer;
        }

        .home-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 40px rgba(167, 139, 250, 0.5);
        }

        .home-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Light Theme Support */
        @media (prefers-color-scheme: light) {
            body { background-color: #f9f9f9; color: #171717; }
            body::before { background: radial-gradient(circle, rgba(124, 58, 237, 0.08) 0%, transparent 60%); }
            .error-container { background: rgba(255, 255, 255, 0.8); border-color: rgba(0, 0, 0, 0.08); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.1); }
            .error-title { color: #171717; }
            .error-desc { color: #525252; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Lost in the Matrix?</h1>
        <p class="error-desc">
            The page you are looking for doesn't exist, has been moved, or is hiding in another dimension.
        </p>
        <a href="/" class="home-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Return to VEYRONIS
        </a>
    </div>
</body>
</html>
